<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="רק שלנו">
<title>רק שלנו</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Design system shared with צעד: same tokens, type and components; accent is ours (set in app.js) */
[hidden]{display:none!important}
:root{color-scheme:light;--bg:#EEF4F5;--sur:#FFFFFF;--ink:#12263A;--mut:#5B6F80;--edge:#768C97;--line:#D3E0E3;--sun:#F2B544;--warn:#C2453A;--note:#FFF4D6;--glow:14%;
  --acc:#C2185B;--accT:#FFFFFF;--h1:#F06292;--h2:#AD1457}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]){color-scheme:dark;--bg:#0F1B26;--sur:#162736;--ink:#E8F0F3;--mut:#92A6B4;--edge:#5E7A8C;--line:#243746;--warn:#E57368;--note:#2B2A1E;--glow:22%;
  --acc:#F27BA4;--accT:#2A0614;--h1:#F48FB1;--h2:#C2185B}}
:root[data-mode=dark]{color-scheme:dark;--bg:#0F1B26;--sur:#162736;--ink:#E8F0F3;--mut:#92A6B4;--edge:#5E7A8C;--line:#243746;--warn:#E57368;--note:#2B2A1E;--glow:22%;
  --acc:#F27BA4;--accT:#2A0614;--h1:#F48FB1;--h2:#C2185B}
/* aliases used across the app */
:root{--card:var(--sur);--soft:var(--mut);--rose:var(--acc);--blush:color-mix(in srgb,var(--acc) 14%,var(--sur))}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/25px Heebo,system-ui,Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  background-image:linear-gradient(to bottom,color-mix(in srgb,var(--acc) var(--glow),transparent),transparent 260px);background-repeat:no-repeat}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:26px;line-height:34px;font-weight:800}
h2{font-size:21px;line-height:28px;font-weight:800}
h3{font-size:18px;line-height:25px;font-weight:600}
.sub{color:var(--mut);font-size:15px;line-height:22px}
small,.small{font-size:13px;line-height:18px;color:var(--mut)}
main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 24px;display:grid;gap:16px}

/* buttons */
button{font:600 17px Heebo,sans-serif;min-height:52px;border:0;border-radius:14px;padding:0 20px;background:var(--acc);color:var(--accT);cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--edge);font-weight:400}
button.mini{min-height:38px;padding:0 12px;font-size:14px;font-weight:400;background:transparent;color:var(--mut);border:1.5px solid var(--line);border-radius:999px}
.linkbtn{min-height:42px;border-radius:999px;border:1.5px solid var(--acc);background:var(--sur);color:var(--acc);padding:0 18px;font-size:15px}
button.wide,a.wide{width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
a.wa{min-height:52px;border-radius:14px;background:#1F9D55;color:#fff;font-weight:600;font-size:17px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* fields */
form{display:grid;gap:8px}
label{font-weight:600;font-size:15px;margin-top:6px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--sur);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:right}
input[dir=ltr]{text-align:left}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;line-height:18px;color:var(--mut);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}.check input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--acc)}
.err{color:var(--warn);font-weight:600;margin:0}
.info{background:var(--blush);border-radius:12px;padding:10px 12px;margin:0}

/* cards, chips, rows */
.card{background:var(--sur);border:1.5px solid var(--line);border-radius:16px;padding:16px}
button.card{color:var(--ink);text-align:start;font-weight:400;width:100%;display:block;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;border-radius:999px;background:var(--sur);color:var(--ink);border:1.5px solid var(--line);font-size:15px;font-weight:600;padding:0 16px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.list{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:13px;line-height:18px;padding:3px 10px;border-radius:999px;background:var(--blush);color:var(--ink);white-space:nowrap;font-weight:600}
.pill.hot{background:var(--acc);color:var(--accT)}
.fi{flex:none;width:38px;height:38px;border-radius:12px;background:var(--bg);color:var(--acc);display:grid;place-items:center}
.group{padding:0}.group>*+*{border-top:1.5px solid var(--line)}
.mrow{display:flex;gap:12px;align-items:center;width:100%;min-height:68px;padding:12px 16px;background:none;color:var(--ink);border-radius:0;text-align:start;text-decoration:none;font-weight:400}
.mt{flex:1;display:grid}.mt b{font-weight:600;font-size:17px;line-height:24px}.mt .sub{font-size:14px;line-height:20px}
.chev{color:var(--mut);font-size:24px;line-height:1}
.pad{padding:14px 16px}
h3.sec{font-size:15px;font-weight:600;color:var(--mut);margin:8px 4px -8px}
.seg{display:flex;gap:4px;background:var(--sur);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;background:none;color:var(--mut);border-radius:10px;min-height:44px;padding:0 6px;font-size:15px;font-weight:400}
.seg button[aria-selected=true]{background:var(--acc);color:var(--accT);font-weight:600}
details summary{cursor:pointer;color:var(--mut);min-height:44px;display:flex;align-items:center}
.center{text-align:center}
.back{background:none;color:var(--acc);padding:0;min-height:40px;justify-self:start;font-size:15px}
button.plain{background:none;color:inherit;padding:0;text-align:start;border-radius:0;font-weight:400;min-height:0;display:block;width:100%}

.gbtn{background:var(--sur);color:var(--ink);border:1.5px solid var(--line);gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}
.switch{flex:none;width:52px;min-height:32px;height:32px;border-radius:999px;padding:0;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:inset-inline-start .2s}
.switch[aria-checked=true]{background:var(--acc)}.switch[aria-checked=true] i{inset-inline-start:23px}
/* avatar */
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--av,var(--acc));color:#fff;display:grid;place-items:center;font:800 28px Heebo;border:3px solid var(--sur);box-shadow:0 0 0 1.5px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.emo{font-size:34px;font-family:"Noto Color Emoji",system-ui,sans-serif}.avatar.sm.emo{font-size:26px}
.avatar.xl{width:140px;height:140px;font-size:60px}.avatar.xl.emo{font-size:72px}
.duo{position:relative;flex:none}.duo .sm2{position:absolute;bottom:-6px;inset-inline-end:-10px;width:38px;height:38px;font-size:16px}.duo .sm2.emo{font-size:20px}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:var(--acc);color:var(--accT);font-weight:600;font-size:17px;cursor:pointer}
.emos{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.emo-b{min-height:52px;padding:0;font-size:28px;background:var(--bg);border:2px solid transparent;border-radius:14px}.emo-b[aria-pressed=true]{border-color:var(--acc);background:var(--blush)}
.colb{width:40px;min-height:40px;height:40px;padding:0;border-radius:50%;background:var(--c);border:3px solid var(--sur);box-shadow:0 0 0 1.5px var(--line)}.colb[aria-pressed=true]{box-shadow:0 0 0 3px var(--acc)}
.avatar.sm{width:52px;height:52px;font-size:22px}

/* onboarding */
body[data-stage=splash],body[data-stage=intro],body[data-stage=auth],body[data-stage=focus],body[data-stage=notify],body[data-stage=pair],body[data-stage=wait],body[data-stage=welcome]{padding-bottom:0}
.onb{min-height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.onb .lead{color:var(--mut);font-size:15px;line-height:22px;margin:-6px 0 0}
.onb .body{font-size:17px;line-height:28px;margin:0}
.dots{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}.dots i{width:22px;height:10px;border-radius:6px;background:var(--line)}.dots i.on{background:var(--acc);width:40px}
.onbbtns{margin-top:auto;display:grid;gap:12px;padding-top:12px}
.splash{align-items:center;justify-content:center;text-align:center;gap:10px}
.splash h1{font-size:44px;line-height:52px}
.splash .tag{color:var(--mut);font-size:18px;margin:0}
.splash .onbbtns{width:100%;margin-top:28px}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{transform:scale(.5);opacity:0}}.fade{animation:fade .5s ease both .3s}@keyframes fade{from{opacity:0;transform:translateY(10px)}}}
.howbox{background:var(--sur);border:1.5px solid var(--line);border-radius:16px;padding:16px}.howbox b{display:block;margin-bottom:4px}.howbox p{margin:0;color:var(--mut);font-size:15px;line-height:23px}
.choice{display:flex;gap:14px;align-items:center;text-align:start;background:var(--sur);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:16px;min-height:84px;width:100%;font-weight:400}
.choice .fi{width:44px;height:44px}.choice span.t{display:grid;font-size:14px;color:var(--mut)}.choice b{font-size:18px;color:var(--ink);font-weight:600}
.codein{text-transform:uppercase;letter-spacing:.25em;font-size:22px;text-align:center!important}
.code{font:800 40px/1 Heebo;letter-spacing:.14em;text-align:center;background:var(--sur);border:1.5px solid var(--line);border-radius:16px;padding:20px;direction:ltr;color:var(--acc)}
.mark{display:flex}

/* welcome (daily) */
.welcome{align-items:center;text-align:center;justify-content:center}
.welcome h1{font-size:32px;line-height:40px}
.wpill{border:1.5px solid var(--line);background:var(--sur);border-radius:999px;padding:6px 18px;font-weight:600}
.wcard{text-align:start;width:100%;display:grid;gap:4px}.wcard p{margin:0;font-size:19px;line-height:28px;font-weight:800}.whot{color:var(--acc);margin-bottom:6px}
.wline{color:var(--mut);font-style:italic;margin:0}
.wgo{max-width:320px;border-radius:999px}

/* home */
.hhead{display:flex;align-items:center;gap:12px}
.hh{flex:1;display:grid}.hh b{font-size:26px;line-height:32px;font-weight:800}
.pills{display:flex;gap:8px}
.hp{display:flex;align-items:center;gap:6px;background:var(--sur);color:var(--mut);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;min-height:46px;font-weight:800}
.hp b{font-size:18px}.hp.on{border-color:var(--sun);color:var(--ink)}.hp.on svg{color:var(--acc)}
.hero{display:grid;place-items:center;text-align:center}
.hero svg{width:min(70vw,270px);height:auto;filter:drop-shadow(0 12px 18px color-mix(in srgb,var(--h2) 35%,transparent))}
.hero .n{font:800 66px Heebo,sans-serif;fill:#fff}.hero .l{font:600 18px Heebo,sans-serif;fill:#fff}
@media(prefers-reduced-motion:no-preference){.beat{animation:beat 2.4s ease-in-out infinite;transform-origin:50% 55%}@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.04)}24%{transform:scale(1)}}}
.qcard p{margin:8px 0 0;font-size:19px;line-height:28px;font-weight:800}
.alert{background:var(--acc);color:var(--accT);border-radius:16px;padding:16px;display:grid;gap:10px}
.alert .sub{color:inherit;opacity:.85}
.alert button{background:var(--sur);color:var(--acc)}
.note{background:var(--note);border:1.5px solid color-mix(in srgb,var(--sun) 45%,var(--line));border-radius:4px 16px 16px 16px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.note.mine{background:var(--blush);border-color:color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px 4px 16px 16px}
.note .meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
.ev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.ev:last-child{border:0}.ev b{font-weight:800;font-size:20px;color:var(--acc);white-space:nowrap}
button.card.ev{display:flex;border:1.5px solid var(--line);padding:16px}
.jar{display:grid;place-items:center;gap:12px;text-align:center}
.drawn{background:var(--note);border-radius:16px;padding:20px;font-size:22px;line-height:30px;font-weight:800;text-align:center;width:100%}
.issue{border-inline-start:5px solid var(--acc)}.issue.solved{border-inline-start-color:#2F9E6E}
.issue dl{margin:8px 0;display:grid;gap:6px}.issue dt{font-size:13px;color:var(--mut)}.issue dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.guide{background:var(--sur);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px;font-size:15px}
.guide ul{margin:0 0 10px;padding-inline-start:18px}.guide summary{color:var(--ink)}
.mem{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start}
.mem time{font-weight:800;font-size:15px;line-height:20px;color:var(--acc);text-align:center;background:var(--bg);border-radius:12px;padding:8px 4px}

/* plans */
button.card.plan{display:flex;gap:14px;align-items:center;width:100%}
.pdate{flex:none;width:56px;height:60px;border-radius:14px;background:var(--blush);color:var(--acc);display:grid;place-content:center;text-align:center;font-size:13px;font-weight:600;line-height:16px}.pdate b{font-size:24px;line-height:26px;font-weight:800}
.pinfo{flex:1;display:grid}.pinfo b{font-size:17px;line-height:24px;font-weight:600}
button.card.review{display:grid;gap:2px;border-color:var(--sun)}
.phead{display:grid;gap:6px;justify-items:start}
.stars{color:var(--sun);letter-spacing:2px}
.chip.star{font-size:20px;min-width:48px;padding:0}.chip.star[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#3a2800}
/* games */
button.card.turn{display:grid;gap:2px;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--sur))}
.game{display:grid;gap:12px}.gh{display:flex;gap:12px;align-items:flex-start}.gh>div{display:grid}.gh b{font-size:18px;line-height:25px}
.gi{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.gstat{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.tot{display:grid;gap:12px;margin-top:8px}.or2{text-align:center;color:var(--mut);font-weight:600}
.totb{min-height:110px;border-radius:20px;background:var(--sur);color:var(--ink);border:2px solid var(--line);font-size:26px;font-weight:800}
.totb:active{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.totb.sm{min-height:60px;font-size:18px;border-radius:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mk{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--mut);font-weight:800}.mk.ok{background:var(--acc);color:var(--accT)}
.note.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.hh .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* premium */
.prem{display:grid;gap:6px;justify-items:center;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--sur)),var(--sur))}
.pbadge{font-size:44px;line-height:1}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plan-o{display:grid;gap:2px;justify-items:center;text-align:center;position:relative;padding-top:20px}.plan-o.best{border-color:var(--acc)}.plan-o .pill{position:absolute;top:-11px}
.pp{font-size:30px;line-height:38px;font-weight:800;color:var(--acc)}
.game.locked{opacity:.75}
button.card.lock{display:flex;gap:12px;align-items:center;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 10%,var(--sur))}
/* me */
.profile2{display:grid;gap:16px}.ptop{display:flex;gap:16px;align-items:center}.ptop .avatar{width:80px;height:80px;font-size:34px}
.editp{min-height:40px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid var(--line);padding-top:14px}
.stats>div{display:grid;justify-items:center;gap:2px;text-align:center}.stats>div+div{border-inline-start:1.5px solid var(--line)}
.stats span{color:var(--acc)}.stats b{font-size:24px;line-height:30px;font-weight:800}.stats small{font-size:12px;line-height:16px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.sw{display:grid;justify-items:center;gap:6px;background:none;color:var(--ink);padding:6px;border-radius:14px;min-height:auto;font-size:13px;font-weight:400;border:2px solid transparent}
.sw i{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--a) 0 50%,var(--a2) 50%);box-shadow:inset 0 0 0 3px var(--sur),0 0 0 1.5px var(--line)}
.sw[aria-pressed=true]{border-color:var(--acc)}

/* sheets & photo editor */
.sheetbg{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:30}
.sheet{position:fixed;inset:auto 0 0 0;z-index:31;background:var(--sur);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:85dvh;overflow:auto;max-width:560px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheetrow{display:flex;gap:12px;align-items:center;background:var(--bg);color:var(--ink);border-radius:14px;font-weight:600;text-align:start;padding:0 16px}.sheetrow span{font-size:22px}.sheetrow.warn{color:var(--warn)}
.cropwrap{position:fixed;inset:0;z-index:40;background:rgb(8 12 18/.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;padding:20px}
#cropc{width:min(300px,80vw);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 2000px rgb(0 0 0/.25);touch-action:none;cursor:grab;background:#000}
.zoom{display:flex;align-items:center;gap:12px;width:min(300px,80vw);font-size:22px;font-weight:800}.zoom input{flex:1;accent-color:var(--acc);padding:0;border:0;background:none}
.avbtn{position:relative;background:none;padding:0;min-height:0;border-radius:50%}
.avedit{position:absolute;bottom:6px;inset-inline-start:6px;width:40px;height:40px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:18px;border:3px solid var(--bg)}
.nickline{background:var(--blush);border-radius:999px;padding:4px 14px;font-size:15px}
/* app lock */
.faces{display:flex;align-items:center;justify-content:center;direction:ltr}
.faces .avatar.fa{width:104px;height:104px;font-size:44px;border-width:4px}.faces .avatar.fa.emo{font-size:54px}
.faces .avatar{position:relative;z-index:1}.faces .fheart{color:var(--acc);margin:0 -18px;z-index:3;position:relative;filter:drop-shadow(0 2px 6px rgb(0 0 0/.18))}
.faces.sm .avatar.fa{width:72px;height:72px;font-size:30px;border-width:3px}.faces.sm .avatar.fa.emo{font-size:38px}.faces.sm .fheart{margin:0 -10px}
